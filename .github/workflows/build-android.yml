name: Build MD Reel Current Affair APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: npm run build

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Install Native Plugins and MainActivity
        run: |
          JAVA_DIR="android/app/src/main/java/com/md/mdreelcurrentaffair"
          mkdir -p "$JAVA_DIR"

          cp -f NativeTtsPlugin.java "$JAVA_DIR/NativeTtsPlugin.java"
          cp -f VideoFixerPlugin.java "$JAVA_DIR/VideoFixerPlugin.java"
          cp -f MainActivity.java "$JAVA_DIR/MainActivity.java"

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'android/app/src/main/AndroidManifest.xml'
          android = '{http://schemas.android.com/apk/res/android}'

          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')

          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
          ]

          existing = {
              e.get(android + 'name')
              for e in root.findall('uses-permission')
          }

          for permission in permissions:
              if permission not in existing:
                  node = ET.Element(
                      'uses-permission',
                      {android + 'name': permission}
                  )

                  if permission == 'android.permission.WRITE_EXTERNAL_STORAGE':
                      node.set(android + 'maxSdkVersion', '29')

                  elif permission == 'android.permission.READ_EXTERNAL_STORAGE':
                      node.set(android + 'maxSdkVersion', '32')

                  root.insert(0, node)

          queries = root.find('queries')

          if queries is None:
              queries = ET.Element('queries')
              root.insert(0, queries)

          has_tts_query = any(
              intent.find(
                  "action[@" + android + "name='android.intent.action.TTS_SERVICE']"
              ) is not None
              for intent in queries.findall('intent')
          )

          if not has_tts_query:
              intent = ET.SubElement(queries, 'intent')
              ET.SubElement(
                  intent,
                  'action',
                  {android + 'name': 'android.intent.action.TTS_SERVICE'}
              )

          tree.write(
              path,
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reel-Current-Affair-v18-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
