
name: Build MD Reel Current Affair v20 MP4 Fix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Verify Required Files
        run: |
          test -f www/index.html
          test -f NativeTtsPlugin.java
          test -f VideoFixerPlugin.java
          test -f MainActivity.java
          echo "Required files verified."

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Install Native Plugins
        run: |
          JAVA_DIR="android/app/src/main/java/com/md/mdreelcurrentaffair"
          mkdir -p "$JAVA_DIR"

          cp -f NativeTtsPlugin.java "$JAVA_DIR/NativeTtsPlugin.java"
          cp -f VideoFixerPlugin.java "$JAVA_DIR/VideoFixerPlugin.java"
          cp -f MainActivity.java "$JAVA_DIR/MainActivity.java"

      - name: Add Media3 Transformer Dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/build.gradle')
          s = p.read_text()

          dep = '    implementation "androidx.media3:media3-transformer:1.5.1"\n'

          if 'androidx.media3:media3-transformer' not in s:
              marker = 'dependencies {'

              if marker not in s:
                  raise SystemExit(
                      'Could not find dependencies block in android/app/build.gradle'
                  )

              s = s.replace(marker, marker + '\n' + dep, 1)
              p.write_text(s)

          PY

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'android/app/src/main/AndroidManifest.xml'
          a = '{http://schemas.android.com/apk/res/android}'

          ET.register_namespace(
              'android',
              'http://schemas.android.com/apk/res/android'
          )

          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS'
          ]

          existing = {
              e.get(a + 'name')
              for e in root.findall('uses-permission')
          }

          for permission in permissions:
              if permission not in existing:
                  root.insert(
                      0,
                      ET.Element(
                          'uses-permission',
                          {a + 'name': permission}
                      )
                  )

          tree.write(
              path,
              encoding='utf-8',
              xml_declaration=True
          )
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reel-Current-Affair-v20-H264-AAC-MP4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
