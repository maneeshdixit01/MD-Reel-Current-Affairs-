name: Build MD Reel Current Affair v21

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Verify Required Files
        run: |
          test -f www/index.html
          test -f NativeTtsPlugin.java
          test -f VideoFixerPlugin.java
          test -f MainActivity.java
          echo "Required source files found."

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Install Native Plugins
        run: |
          JAVA_DIR="android/app/src/main/java/com/md/mdreelcurrentaffair"
          mkdir -p "$JAVA_DIR"

          cp -f NativeTtsPlugin.java "$JAVA_DIR/"
          cp -f VideoFixerPlugin.java "$JAVA_DIR/"
          cp -f MainActivity.java "$JAVA_DIR/"

      - name: Configure Media3 Dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("android/app/build.gradle not found")

          s = p.read_text()

          for artifact in ["media3-transformer", "media3-common"]:
              pattern = (
                  r'^\s*implementation\s+["\']androidx\.media3:'
                  + artifact +
                  r':[0-9.]+["\']\s*$\n?'
              )
              s = re.sub(pattern, "", s, flags=re.MULTILINE)

          marker = "dependencies {"

          if marker not in s:
              raise SystemExit("Gradle dependencies block not found")

          deps = (
              '    implementation "androidx.media3:media3-common:1.3.1"\n'
              '    implementation "androidx.media3:media3-transformer:1.3.1"\n'
          )

          s = s.replace(marker, marker + "\n" + deps, 1)
          p.write_text(s)

          print("Media3 1.3.1 configured.")
          PY

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          android = "{http://schemas.android.com/apk/res/android}"

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS"
          ]

          existing = {
              e.get(android + "name")
              for e in root.findall("uses-permission")
          }

          for permission in permissions:
              if permission not in existing:
                  root.insert(
                      0,
                      ET.Element(
                          "uses-permission",
                          {android + "name": permission}
                      )
                  )

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Manifest configured.")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Media3 Dependencies
        run: |
          grep -n "media3-common:1.3.1" android/app/build.gradle
          grep -n "media3-transformer:1.3.1" android/app/build.gradle

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD-Reel-Current-Affair-v21-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
